    .nav-card {
      border-radius: 1rem;
      height: 100px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: all 0.3s ease;
      position: relative;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .nav-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(45deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
      pointer-events: none;
      border-radius: 1rem;
    }

    .nav-card:hover {
      transform: translateY(-5px) scale(1.02);
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
      border-radius: 1.5rem;
    }

    .nav-card a {
      display: block;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-card p {
      margin: 0;
      line-height: 1.2;
      font-size: 1.5rem;
      font-weight: 600;
      color: white;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .section-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: #333;
      margin: 1.5rem 0 1rem;
      padding-left: 0.5rem;
      border-left: 4px solid #667eea;
    }

    #main {
      width: 100%;
      max-width: 600px;
      height: 400px;
      margin: 2rem auto;
      background: white;
      border-radius: 1rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
    }

    .flip-image {
      perspective: 1000px;
      width: 300px;
      height: 300px;
      margin: 2rem auto;
    }

    .flip-image-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.8s;
      transform-style: preserve-3d;
      cursor: pointer;
      border-radius: 1rem;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .flip-image:hover .flip-image-inner {
      transform: rotateY(180deg);
    }

    .flip-image-front, .flip-image-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 1rem;
    }

    .flip-image-back {
      transform: rotateY(180deg);
    }

    .flip-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .footer {
      text-align: center;
      margin-top: 2rem;
      padding: 1rem;
      color: #666;
      font-size: 0.9rem;
    }
  </style>

  <script>
    var t = null;
    t = setTimeout(time, 1000);
    function time() {
      clearTimeout(t);
      dt = new Date();
      var sr = "2022/11/04";
      var y = dt.getFullYear();
      var mt = dt.getMonth() + 1;
      var day = dt.getDate();
      var h = dt.getHours();
      var m = dt.getMinutes();
      if (m < 10) { m = "0" + String(m); }
      var s = dt.getSeconds();
      if (s < 10) { s = "0" + String(s); }
      var dat = y+"/"+mt+"/"+day;
      dat = Date.parse(dat);
      var rq = Date.parse(sr);
      sr = dat - rq;
      sr = sr / 60 / 60 / 24 / 1000
      var weekday = new Array(7);
      weekday[0] = "星期日";
      weekday[1] = "星期一";
      weekday[2] = "星期二";
      weekday[3] = "星期三";
      weekday[4] = "星期四";
      weekday[5] = "星期五";
      weekday[6] = "星期六";
      document.querySelector(".showTime").innerHTML =
        y + "年" + mt + "月" + day + "日 " + weekday[dt.getDay()] + "<br>" + h + ":" + m + ":" + s + "<br>✨ 润杰今天" + Math.floor(sr) + "天了哦";
      t = setTimeout(time, 1000);
    }
  </script>
